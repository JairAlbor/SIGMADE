<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Material</title>
    <link rel="stylesheet" href="css/nav-bar.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/catalogo.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
           <script src="https://unpkg.com/lucide@latest"></script>

  </head>
  <body>
    <nav class="navbar">
      <div class="logo">SIGMADE</div>

      <ul class="nav-menu">
        <li
          class="nav-item"
          onclick="irAInicio()"
        >
          Inicio
        </li>
        <li class="nav-item active">Catalogo</li>
        <li class="nav-item" onclick="window.location.href = 'profile.html'">
          Perfil
        </li>
      </ul>

      <div class="top-bar-user">
        <div class="notification-wrapper">
          <i data-lucide="bell" class="icon-bell"></i>
          <span class="notification-dot"></span>
        </div>

        <div class="user-pill">
          <div class="user-avatar">
            <i data-lucide="user" class="icon-user"></i>
          </div>
          <span id="userName" class="user-name"> </span>
        </div>
      </div>
    </nav>
    <div class="form-container">
  <div class="header-catalogo">
    <h1>Catálogo de Material</h1>
   
  </div>

  <div id="contenedor-formulario" class="form-card hidden">
    <h3>Nuevo Material</h3>
    <div class="form-grid">
      <form id="formArticulo">
        <input type="text" name="nombreArticulo" id="nombreArticulo" placeholder="Nombre del artículo" />
        
        <select id="disciplina" name="disciplina">
          <option value="">Seleccionar disciplina</option>
          <option value="1">Fútbol</option>
          <option value="2">Básquetbol</option>
          <option value="3">Ajedrez</option>
          <option value="4">Escolta</option>
        </select>
        
        <select name="estado" id="estado">
          <option value="">Seleccionar estado</option>
          <option value="Nuevo">Nuevo</option>
          <option value="Bueno">Bueno</option>
          <option value="Regular">Regular</option>
          <option value="Muy-desgastado">Muy Desgastado</option>
          <option value="Roto">Roto</option>
        </select>
        
        <select name="tipoMaterial" id="tipoMaterial">
          <option value="">Seleccionar tipo de material</option>
          <option value="Material deportivo">Material deportivo</option>
          <option value="Cancha">Cancha</option>
        </select>
        
        <label for="imagen">Ingresa una imagen del artículo</label>
        <input type="file" id="imagen" name="imagen" accept="image/*" />
      
    </div>
    
    <div class="form-actions">
      <button id="btn-cancelar" class="btn-secundario">Cancelar</button>
      <button  onclick="guardarArticulo()" type="submit" id="btn-exito" class="btn-exito">Guardar Material</button>
    </div>
  </form>
  
  </div>
  <div class="tabla-container">
    
    <div class="controls-container">
  <div class="search-bar-container">
        <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Buscar material..." id="searchMaterial">
        </div>
    </div>
 <button id="btn-abrir-formulario" class="btn-principal">
      + Agregar Material
    </button>
    <div class="stats-cards">
        <div class="stat-card total">
           
            <span class="stat-label">Total artículos</span>
             <span class="stat-number" id="articulos"></span>
            
        </div>
        <div class="stat-card available">
            
            <span class="stat-label">Disponibles</span>
            <span class="stat-number" id="disponibles"></span>
        
        </div>
    </div>
    </div>
  

    <div class="table-responsive">
    <table class="material-table">
        <thead>
            <tr>
                <th>Artículo</th>
                <th>Categoría</th>
                <th>Tipo Material</th>
                <th>Estado</th>
                <th>Disponible</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-cuerpo">
            </tbody>
    </table>
</div>
</div>
</div>


    <script>
      lucide.createIcons();
    </script>
    <script src="nav-utils.js"></script>
    <script src="modal-js/modal-catalogo.js"></script>
    <script src="app.js"></script>
  </body>
</html>
