<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Administración</title>
    <link rel="stylesheet" href="stylennn.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <main class="dashboard-container">
        <header class="dashboard-header">
            <h2 class="title">Panel de Administración</h2>

        </header>
        
        <div class="main-grid">
            
            <section class="card-featured">
                <div class="card-header">
                    <h3>Préstamos Activos</h3>
                    <i class="fa-solid fa-book-open icon-large"></i>
                </div>
                
                <div class="card-body">
                    <div class="big-number">12</div>
                    <p class="subtitle">Préstamos en curso</p>
                    
                    <div class="status-list">
                        <div class="status-item">Vencen hoy: 3</div>
                        <div class="status-item">Vencidos: 1</div>
                    </div>
                </div>
                
                <footer class="card-footer">
                    Click para ver detalles →
                </footer>
            </section>

            <div class="secondary-grid">
                <button class="card-small">
                    <i class="fa-solid fa-dumbbell"></i>
                    <h3>Disciplinas</h3>
                    <p class="count">8</p>
                </button>

                <button class="card-small">
                    <i class="fa-solid fa-users"></i>
                    <h3>Usuarios</h3>
                    <p class="count">156</p>
                </button>

                <button class="card-small">
                    <i class="fa-solid fa-calendar-days"></i>
                    <h3>Eventos</h3>
                    <p class="count">5</p>
                </button>

                <button class="card-small">
                    <i class="fa-solid fa-user-gear"></i>
                    <h3>Entrenadores</h3>
                    <p class="count">12</p>
                </button>
            </div>
        </div>
    </main>

</body>
</html>
