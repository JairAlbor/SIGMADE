<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/nav-bar.css">
    <link rel="stylesheet" href="css/profile.css">
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
  <nav class="navbar">
    <div class="logo-container" style="display: flex; align-items: center; gap: 15px;">
        <img src="LOGO-UTM.jpeg" alt="Logo" style="height: 48px; border-radius: 8px;">
        <img src="uuutm.png" alt="UTM Logo" style="height: 48px;">
    </div>
    <ul class="nav-menu">
      <li class="nav-item" onclick="irAInicio()">
        <i class="fa-solid fa-house" style="margin-right:5px;"></i>Inicio
      </li>
      <li class="nav-item" onclick="window.location.href='catalogo.html'">
        <i class="fa-solid fa-box-open" style="margin-right:5px;"></i>Catálogo
      </li>
      <li class="nav-item" onclick="window.location.href='profile.html'">
        <i class="fa-solid fa-user-circle" style="margin-right:5px;"></i>Perfil
      </li>
    </ul>
    <div class="top-bar-user">
      <div class="notification-wrapper">
        <i data-lucide="bell" class="icon-bell"></i>
        <span class="notification-dot"></span>
      </div>
      <div class="user-pill">
        <div class="user-avatar">
          <i data-lucide="user" class="icon-user"></i>
        </div>
        <span id="userName" class="user-name" style="font-size:0.9rem;">Usuario</span>
        <button onclick="logout()" class="logout-btn" title="Cerrar sesión" style="background:transparent; border:none; color:white; cursor:pointer; padding:5px; margin-left:5px;">
          <i data-lucide="log-out" class="icon-logout"></i>
        </button>
      </div>
    </div>
  </nav>

    <section class="form-container">
      <main class="dashboard-container profile-page">
        <h1 class="dashboard-title">Mi Perfil</h1>

        <div class="profile-grid">
          <section class="profile-main-card">
            <div class="profile-header">
              <div class="profile-avatar-large">
                <i data-lucide="user"></i>
              </div>
              <div class="profile-header-info">
                <h2 id="profileName"></h2>
                <p>Miembro desde: <span id="profileCreateAt"></span></p>
              </div>
            </div>

            <hr class="divider" />

            <div class="profile-details">
              <div class="detail-item">
                <i data-lucide="mail"></i>
                <span id="profileEmail"></span>
              </div>
              <div class="detail-item">
                <i data-lucide="phone"></i>
                <span id="profileTelefono"></span>
              </div>
              <div class="detail-item">
                <i data-lucide="map-pin"></i>
                <span id="profileUbicacion">Sin ubicación</span>
              </div>
              <div class="detail-item">
                <i data-lucide="calendar"></i>
                <span id="profileNacimiento">Sin fecha de nacimiento</span>
              </div>
            </div>
          </section>

          <aside class="profile-stats">
            <div class="stat-card">
              <div class="stat-header">
                <i data-lucide="briefcase"></i>
                <span id="profileRol"></span>
              </div>
            </div>

            <div class="stat-card">
              <div class="stat-header">
                <i data-lucide="calendar-check"></i>
                <span>Frecuencia de prestamos</span>
              </div>
              <span id="profileFrecuencia"></span>
            </div>

            <div class="stat-card">
              <div class="stat-header">
                <i data-lucide="user-check"></i>
                <p>Estado del usuario</p>
              </div>
              <span id="profileEstatus"></span>
            </div>
          </aside>
        </div>

        <section class="activity-section">
          <h3>Historial de prestamos</h3>
          <div class="activity-placeholder"></div>
        </section>
      </main>
    </section>
    <script>lucide.createIcons();</script>
    <script src="nav-utils.js"></script>
    <script src="profile.js"></script>
  </body>
</html>
